name: Capture real eNet App UI

on:
  push:
    branches:
      - fix/enet-072-session-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Render authentic Flutter screens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render actual Flutter app, with local test account
        env:
          ENET_CAPTURE_UI: '1'
        run: flutter test test/ui_preview_capture_test.dart -j 1 --reporter expanded
      - name: Upload real Flutter screenshots
        uses: actions/upload-artifact@v4
        with:
          name: enet-app-actual-ui-screenshots
          path: ui_previews/*.png
          if-no-files-found: error
          retention-days: 14
