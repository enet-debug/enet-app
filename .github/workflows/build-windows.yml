name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --org com.enetdev .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release
        shell: pwsh
        env:
          ENET_SUPABASE_URL: ${{ vars.ENET_SUPABASE_URL }}
          ENET_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ENET_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENET_SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:ENET_SUPABASE_PUBLISHABLE_KEY)) {
            throw "Configure the ENET_SUPABASE_URL and ENET_SUPABASE_PUBLISHABLE_KEY repository variables before a release build."
          }
          flutter build windows --release --dart-define="ENET_SUPABASE_URL=$env:ENET_SUPABASE_URL" --dart-define="ENET_SUPABASE_PUBLISHABLE_KEY=$env:ENET_SUPABASE_PUBLISHABLE_KEY"

      - name: Package application
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          if (!(Test-Path $releaseDir)) {
            throw "Flutter Windows release directory was not found."
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "eNet-Windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: eNet-Windows-x64
          path: eNet-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
