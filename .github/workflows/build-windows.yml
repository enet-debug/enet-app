name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --org com.enetdev .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

      - name: Package application
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          if (!(Test-Path $releaseDir)) {
            throw "Flutter Windows release directory was not found."
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "eNet-Windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: eNet-Windows-x64
          path: eNet-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
