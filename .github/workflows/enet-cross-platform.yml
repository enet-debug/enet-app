name: eNet Windows and iOS builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --org ru.enetdev .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release for Windows
        run: flutter build windows --release
      - name: Publish Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: enet-app-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  ios:
    # Pushes already run the dedicated unsigned iOS workflow. Avoid booking
    # two macOS runners for every UI-only commit; keep PR/manual coverage.
    if: github.event_name != 'push'
    name: iOS unsigned compile check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select available Xcode installation
        run: xcodebuild -version
      - name: Generate iOS runner
        run: flutter create --platforms=ios --org ru.enetdev .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Publish unsigned build for validation only
        uses: actions/upload-artifact@v4
        with:
          name: enet-app-ios-unsigned-not-installable
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
          retention-days: 7
