name: eNet Windows and iOS builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content scripts/run-windows.ps1 -Raw))
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --org ru.enetdev .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release for Windows
        run: flutter build windows --release
      - name: Publish Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: enet-app-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned compile check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select available Xcode installation
        run: xcodebuild -version
      - name: Generate iOS runner
        run: flutter create --platforms=ios --org ru.enetdev .
      - name: Set iOS app display name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName eNet" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string eNet" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName eNet" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleName string eNet" ios/Runner/Info.plist
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Publish unsigned build for validation only
        uses: actions/upload-artifact@v4
        with:
          name: enet-app-ios-unsigned-not-installable
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
          retention-days: 7
