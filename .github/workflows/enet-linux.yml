name: eNet API tests and Linux desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash -n scripts/run-linux.sh
      - run: npm test
        working-directory: api

  linux:
    name: Flutter Linux bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Linux runner
        run: flutter create --platforms=linux .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build Linux desktop application
        run: flutter build linux --release --dart-define=ENET_API_URL=http://127.0.0.1:8787
      - name: Publish desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: enet-app-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14
